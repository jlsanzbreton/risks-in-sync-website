[build]
command = "npm run build"
publish = "dist"

[[headers]]
for = "/*"

  [headers.values]
  Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' https://www.googletagmanager.com; style-src 'self'"
  Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
  Referrer-Policy = "strict-origin-when-cross-origin"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"

[[headers]]
for = "/assets/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
